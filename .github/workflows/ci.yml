name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude tuisko-gpu --exclude tuisko-kernels-sm120 --exclude tuisko-qual --all-targets -- -D warnings
      - run: cargo test --workspace --exclude tuisko-gpu --exclude tuisko-kernels-sm120 --exclude tuisko-qual
      - run: cargo bench -p tuisko-model --bench checkpoint -- --sample-size 10
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Host coverage
        run: |
          echo '### Host coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov --package tuisko-model --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features
