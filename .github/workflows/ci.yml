name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude tuisko-engine --exclude tuisko-gpu --exclude tuisko-kernels-sm86 --exclude tuisko-kernels-sm89 --exclude tuisko-kernels-sm120 --exclude tuisko-qual --all-targets -- -D warnings
      - run: cargo clippy --package tuisko-qual --no-default-features --bin qualify-frontend -- -D warnings
      - run: cargo test --workspace --exclude tuisko-engine --exclude tuisko-gpu --exclude tuisko-kernels-sm86 --exclude tuisko-kernels-sm89 --exclude tuisko-kernels-sm120 --exclude tuisko-qual
      - run: cargo check --package tuisko-frontend --bench text
      - run: cargo bench -p tuisko-model --bench checkpoint -- --sample-size 10
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Host coverage
        run: |
          echo '### Host coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov --package tuisko-model --package tuisko-frontend --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTFLAGS: >-
        --remap-path-prefix=${{ github.workspace }}=tuiskollm
        --remap-path-prefix=/home/runner/.cargo=cargo
        --remap-path-prefix=/home/runner/.rustup=rustup
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check python scripts/check_python_release.py
      - run: uv run --locked ruff format --check python scripts/check_python_release.py
      - run: uv run --locked mypy
      - run: uv run --locked maturin build --release --locked --out dist
      - run: uv run --locked maturin sdist --out dist
      - name: Verify Python distributions
        run: |
          version=$(uv run --locked python scripts/check_python_release.py version)
          uv run --locked python scripts/check_python_release.py artifacts \
            --expected "$version" --max-wheel-mib 12 dist/*
      - run: uv pip install --python .venv/bin/python --reinstall dist/*manylinux*.whl
      - name: Smoke-test installed wheel
        run: |
          version=$(uv run --no-sync python scripts/check_python_release.py version)
          uv run --no-sync python scripts/check_python_release.py smoke --expected "$version"
      - run: uv run --no-sync pytest
