[package]
name = "tuisko-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Python bindings for the TuiskoLLM exact text frontend"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3.workspace = true
serde_json.workspace = true
tuisko-frontend.workspace = true
tuisko-model.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
