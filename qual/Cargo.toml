[package]
name = "tuisko-qual"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["device"]
engine = ["dep:tuisko-engine"]
device = [
    "residual-benchmark",
    "engine",
    "dep:tuisko-gpu",
    "dep:tuisko-kernels-sm120",
]
residual-benchmark = []
sm89-residual = [
    "residual-benchmark",
    "dep:tuisko-gpu",
    "dep:tuisko-kernels-sm89",
]
sm86-residual = [
    "residual-benchmark",
    "dep:tuisko-gpu",
    "dep:tuisko-kernels-sm86",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tuisko-engine = { workspace = true, features = ["qualification"], optional = true }
tuisko-frontend.workspace = true
tuisko-gpu = { workspace = true, optional = true }
tuisko-kernels-sm86 = { workspace = true, optional = true }
tuisko-kernels-sm89 = { workspace = true, optional = true }
tuisko-kernels-sm120 = { workspace = true, optional = true }
tuisko-model.workspace = true
tuisko-targets.workspace = true

[[bin]]
name = "bench-device"
path = "src/bin/bench_device.rs"
required-features = ["residual-benchmark"]

[[bin]]
name = "qualify-frontend"
path = "src/bin/qualify_frontend.rs"

[[bin]]
name = "qualify-generation"
path = "src/bin/qualify_generation.rs"
required-features = ["engine"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[lints.rustdoc]
broken_intra_doc_links = "deny"
