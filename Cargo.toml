[package]
name = "tuiskollm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tuisko-provision.workspace = true
tuisko-serve.workspace = true

[workspace]
members = [
    "crates/tuisko-engine",
    "crates/tuisko-frontend",
    "crates/tuisko-gpu",
    "crates/tuisko-kernels-simt",
    "crates/tuisko-kernels-macros",
    "crates/tuisko-kernels-sm120",
    "crates/tuisko-kernels-sm120-attention",
    "crates/tuisko-kernels-sm120-common",
    "crates/tuisko-kernels-sm120-fp8-mlp",
    "crates/tuisko-kernels-sm120-fp8-projection",
    "crates/tuisko-kernels-sm120-gdn",
    "crates/tuisko-kernels-sm120-lm-head",
    "crates/tuisko-kernels-sm120-moe",
    "crates/tuisko-kernels-sm120-mtp",
    "crates/tuisko-kernels-sm120-norm",
    "crates/tuisko-kernels-sm120-nvfp4",
    "crates/tuisko-kernels-sm86",
    "crates/tuisko-kernels-sm89",
    "crates/tuisko-model",
    "crates/tuisko-provision",
    "crates/tuisko-python",
    "crates/tuisko-remote",
    "crates/tuisko-serve",
    "crates/tuisko-targets",
    "qual",
    "qual/server",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = "0.8"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
cuda-core = { version = "0.2.1", git = "https://github.com/blaind/cuda-oxide.git", rev = "0199e55572ee78cd2cea97335e5b7392a3f9be4a" }
cuda-device = { version = "0.2.1", git = "https://github.com/blaind/cuda-oxide.git", rev = "0199e55572ee78cd2cea97335e5b7392a3f9be4a" }
cuda-host = { version = "0.2.1", git = "https://github.com/blaind/cuda-oxide.git", rev = "0199e55572ee78cd2cea97335e5b7392a3f9be4a" }
cuda-intrinsics = { version = "0.1.0", git = "https://github.com/blaind/cuda-oxide.git", rev = "0199e55572ee78cd2cea97335e5b7392a3f9be4a" }
flate2 = "1.1"
memmap2 = "0.9"
page_size = "0.6"
minijinja = { version = "2", features = ["json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
pyo3 = { version = "0.29", features = ["abi3-py312"] }
rayon = "1.12"
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "2.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.53", default-features = false, features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }
tuisko-engine = { version = "0.1.0", path = "crates/tuisko-engine" }
tuisko-frontend = { version = "0.1.0", path = "crates/tuisko-frontend" }
tuisko-gpu = { version = "0.1.0", path = "crates/tuisko-gpu" }
tuisko-kernels-sm86 = { version = "0.1.0", path = "crates/tuisko-kernels-sm86" }
tuisko-kernels-sm89 = { version = "0.1.0", path = "crates/tuisko-kernels-sm89" }
tuisko-kernels-sm120 = { version = "0.1.0", path = "crates/tuisko-kernels-sm120" }
tuisko-kernels-sm120-attention = { version = "0.1.0", path = "crates/tuisko-kernels-sm120-attention" }
tuisko-kernels-sm120-common = { version = "0.1.0", path = "crates/tuisko-kernels-sm120-common" }
tuisko-kernels-sm120-fp8-mlp = { version = "0.1.0", path = "crates/tuisko-kernels-sm120-fp8-mlp" }
tuisko-kernels-sm120-fp8-projection = { version = "0.1.0", path = "crates/tuisko-kernels-sm120-fp8-projection" }
tuisko-kernels-sm120-gdn = { version = "0.1.0", path = "crates/tuisko-kernels-sm120-gdn" }
tuisko-kernels-sm120-lm-head = { version = "0.1.0", path = "crates/tuisko-kernels-sm120-lm-head" }
tuisko-kernels-sm120-moe = { version = "0.1.0", path = "crates/tuisko-kernels-sm120-moe" }
tuisko-kernels-sm120-mtp = { version = "0.1.0", path = "crates/tuisko-kernels-sm120-mtp" }
tuisko-kernels-sm120-norm = { version = "0.1.0", path = "crates/tuisko-kernels-sm120-norm" }
tuisko-kernels-sm120-nvfp4 = { version = "0.1.0", path = "crates/tuisko-kernels-sm120-nvfp4" }
tuisko-kernels-macros = { version = "0.1.0", path = "crates/tuisko-kernels-macros" }
tuisko-kernels-simt = { version = "0.1.0", path = "crates/tuisko-kernels-simt" }
tuisko-model = { version = "0.1.0", path = "crates/tuisko-model" }
tuisko-provision = { version = "0.1.0", path = "crates/tuisko-provision" }
tuisko-remote = { version = "0.1.0", path = "crates/tuisko-remote" }
tuisko-targets = { version = "0.1.0", path = "crates/tuisko-targets" }
tuisko-serve = { version = "0.1.0", path = "crates/tuisko-serve" }
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[lints]
workspace = true
