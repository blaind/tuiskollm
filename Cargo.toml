[package]
name = "tuiskollm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tuisko-model.workspace = true
tuisko-serve.workspace = true

[workspace]
members = [
    "crates/tuisko-engine",
    "crates/tuisko-frontend",
    "crates/tuisko-gpu",
    "crates/tuisko-kernels-sm86",
    "crates/tuisko-kernels-sm89",
    "crates/tuisko-kernels-sm120",
    "crates/tuisko-model",
    "crates/tuisko-python",
    "crates/tuisko-remote",
    "crates/tuisko-targets",
    "crates/tuisko-serve",
    "qual",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = "0.8"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
cuda-core = { version = "0.2.1", git = "https://github.com/NVlabs/cuda-oxide.git", rev = "1f4d813719012d384f2db12b88efc9314c8bf50c" }
cuda-device = { version = "0.2.1", git = "https://github.com/NVlabs/cuda-oxide.git", rev = "1f4d813719012d384f2db12b88efc9314c8bf50c" }
cuda-host = { version = "0.2.1", git = "https://github.com/NVlabs/cuda-oxide.git", rev = "1f4d813719012d384f2db12b88efc9314c8bf50c" }
cuda-intrinsics = { version = "0.1.0", git = "https://github.com/NVlabs/cuda-oxide.git", rev = "1f4d813719012d384f2db12b88efc9314c8bf50c" }
flate2 = "1.1"
memmap2 = "0.9"
minijinja = { version = "2", features = ["json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
pyo3 = { version = "0.29", features = ["abi3-py312"] }
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "2.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.53", default-features = false, features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }
tuisko-engine = { version = "0.1.0", path = "crates/tuisko-engine" }
tuisko-frontend = { version = "0.1.0", path = "crates/tuisko-frontend" }
tuisko-gpu = { version = "0.1.0", path = "crates/tuisko-gpu" }
tuisko-kernels-sm86 = { version = "0.1.0", path = "crates/tuisko-kernels-sm86" }
tuisko-kernels-sm89 = { version = "0.1.0", path = "crates/tuisko-kernels-sm89" }
tuisko-kernels-sm120 = { version = "0.1.0", path = "crates/tuisko-kernels-sm120" }
tuisko-model = { version = "0.1.0", path = "crates/tuisko-model" }
tuisko-remote = { version = "0.1.0", path = "crates/tuisko-remote" }
tuisko-targets = { version = "0.1.0", path = "crates/tuisko-targets" }
tuisko-serve = { version = "0.1.0", path = "crates/tuisko-serve" }
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[lints]
workspace = true
