[package]
name = "tuiskollm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[workspace]
members = ["crates/tuisko-model"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true
